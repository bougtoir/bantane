name: Build Windows Release

on:
  push:
    branches:
      - 'devin/build-release'
      - 'devin/*-release-layout'
  workflow_dispatch:
    inputs:
      license_user_id:
        description: 'ライセンスのユーザーID'
        required: false
        default: 'bantane'
      license_expiration:
        description: '有効期間 (yyyymm または 日数)'
        required: false
        default: '365'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set

      - name: Build standalone exe with Nuitka
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pulpDir = python -c "import pulp, os; print(os.path.dirname(pulp.__file__))"
          Write-Host "pulp package dir: $pulpDir"

          $opts = @(
            "--standalone",
            "--msvc=latest",
            "--lto=yes",
            "--jobs=4",
            "--assume-yes-for-downloads",
            "--windows-console-mode=disable",
            "--enable-plugin=pyside6",
            "--include-package=pulp",
            "--include-module=highspy",
            "--include-package-data=highspy",
            "--include-module=cryptography",
            "--include-module=jpholiday",
            "--include-module=xlrd",
            "--nofollow-import-to=pulp.tests",
            "--include-data-dir=$pulpDir=pulp",
            "--output-filename=BantaneShiftOptimizer.exe",
            "--output-dir=dist_nuitka",
            "--remove-output"
          )

          python -m nuitka $opts app.py

          if (-not (Test-Path "dist_nuitka/app.dist/BantaneShiftOptimizer.exe")) {
            throw "Build failed: BantaneShiftOptimizer.exe not found"
          }

      - name: Build launcher exe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O1 /W3 /D_UNICODE /DUNICODE launcher\launcher.c /Fe:BantaneShiftOptimizer.exe /link /SUBSYSTEM:WINDOWS user32.lib
          if not exist BantaneShiftOptimizer.exe exit /b 1

      - name: Prepare release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "release") { Remove-Item -Recurse -Force "release" }
          New-Item -ItemType Directory -Force "release/bin" | Out-Null

          robocopy dist_nuitka/app.dist release/bin /E /NFL /NDL
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $LASTEXITCODE = 0

          Copy-Item -Path "BantaneShiftOptimizer.exe" -Destination "release/"

          New-Item -ItemType Directory -Force "release/files" | Out-Null
          New-Item -ItemType Directory -Force "release/input" | Out-Null
          New-Item -ItemType Directory -Force "release/output" | Out-Null

          $settings = Get-ChildItem -Path "files" -Filter "*setting*.xlsx" -ErrorAction SilentlyContinue
          if (-not $settings) {
            $settings = Get-ChildItem -Filter "*setting*.xlsx" -ErrorAction SilentlyContinue
          }
          if ($settings) {
            Copy-Item -Path $settings.FullName -Destination "release/files/"
          }

          New-Item -ItemType Directory -Force "release/tools" | Out-Null
          @("generate_license.bat", "generate_license.py", "license_manager.py") | ForEach-Object {
            if (Test-Path $_) { Copy-Item -Path $_ -Destination "release/tools/" }
          }

      - name: Generate license
        shell: pwsh
        env:
          LICENSE_USER_ID: ${{ inputs.license_user_id || 'bantane' }}
          LICENSE_EXPIRATION: ${{ inputs.license_expiration || '365' }}
        run: |
          $ErrorActionPreference = "Stop"
          python generate_license.py --user-id $env:LICENSE_USER_ID --expiration $env:LICENSE_EXPIRATION --output release/files/.license
          if (-not (Test-Path "release/files/.license")) { throw ".license was not generated" }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bantane-release
          path: release
          if-no-files-found: error
